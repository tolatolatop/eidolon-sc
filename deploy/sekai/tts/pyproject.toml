[project]
name = "eidolon-local-tts"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.121.0",
    "kokoro-onnx==0.6.1",
    "misaki[zh]==0.9.4",
    "numpy==2.3.4",
    "onnxruntime==1.23.2",
    "fugashi==1.5.2",
    "unidic-lite==1.0.8",
    "jaconv==0.5.0",
    "mojimoji==0.0.13",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.0.0", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
