[project]
name = "eidolon-local-whisper"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av==16.1.0",
    "faster-whisper==1.2.1",
    "fastapi==0.121.0",
    "numpy==2.3.4",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.0.0", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
