name: sekai-companion

services:
  backend:
    image: ${SEKAI_BACKEND_IMAGE:-sekai-companion-backend:0.1.2}
    env_file: ${SEKAI_ENV_FILE:?set SEKAI_ENV_FILE to the private runtime configuration}
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      EIDOLON_DATABASE_PATH: /data/eidolon.db
      EIDOLON_CHARACTERS_PATH: /characters/characters.toml
      EIDOLON_DEV_LOGIN: "0"
      EIDOLON_AFFINITY_AND_GIFTS: "0"
      EIDOLON_READ_ALOUD_ENABLED: "0"
      EIDOLON_LOCAL_WHISPER_URL: http://whisper:8000
    networks:
      - default
      - asr
    volumes:
      - sekai-data:/data
      - ${SEKAI_CHARACTERS_DIR:?set SEKAI_CHARACTERS_DIR to the isolated character package}:/characters:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 60s
    init: true
    restart: unless-stopped

  backup:
    image: ${SEKAI_BACKEND_IMAGE:-sekai-companion-backend:0.1.2}
    env_file: ${SEKAI_BACKUP_ENV_FILE:?set SEKAI_BACKUP_ENV_FILE to the backup key configuration}
    command: [python, /ops/private_backup.py, loop]
    volumes:
      - sekai-data:/data:ro
      - ${SEKAI_BACKUP_DIR:?set SEKAI_BACKUP_DIR to the encrypted snapshot directory}:/backups
      - ${SEKAI_BACKUP_SCRIPT:?set SEKAI_BACKUP_SCRIPT to private_backup.py}:/ops/private_backup.py:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; p=pathlib.Path('/backups/.last-success'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime<90000 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 2
    init: true
    restart: unless-stopped

  frontend:
    image: ${SEKAI_FRONTEND_IMAGE:-sekai-companion-frontend:0.1.2}
    environment:
      BACKEND_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 30s
    init: true
    restart: unless-stopped

  whisper:
    image: ${SEKAI_WHISPER_IMAGE:-sekai-companion-whisper:0.1.2}
    environment:
      WHISPER_MODEL_PATH: /models/small
      WHISPER_CPU_THREADS: "4"
      OMP_NUM_THREADS: "4"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ${SEKAI_WHISPER_MODEL_DIR:?set SEKAI_WHISPER_MODEL_DIR to the verified small model directory}:/models/small:ro
    networks:
      - asr
    cpus: 4.0
    mem_limit: 4g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 120s
    init: true
    restart: unless-stopped

  gateway:
    image: ${SEKAI_GATEWAY_IMAGE:-nginx:stable-alpine}
    environment:
      SEKAI_TLS_HOST: ${SEKAI_TLS_HOST:?set SEKAI_TLS_HOST to the certificate LAN IP}
      SEKAI_HTTPS_PORT: ${SEKAI_HTTPS_PORT:-18740}
      # Substitute only our settings; keep nginx's $request_uri and $http_host intact.
      NGINX_ENVSUBST_FILTER: ^SEKAI_
    ports:
      - ${SEKAI_BIND_IP:-127.0.0.1}:${SEKAI_PORT:-18739}:8080
      - ${SEKAI_BIND_IP:-127.0.0.1}:${SEKAI_HTTPS_PORT:-18740}:8443
    volumes:
      - ${SEKAI_TLS_DIR:?set SEKAI_TLS_DIR to the certificate directory}/server.crt:/etc/nginx/certs/server.crt:ro
      - ${SEKAI_TLS_DIR:?set SEKAI_TLS_DIR to the certificate directory}/server.key:/etc/nginx/certs/server.key:ro
      - ${SEKAI_NGINX_TEMPLATE:?set SEKAI_NGINX_TEMPLATE to nginx.conf.template}:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --no-check-certificate, -O, /dev/null, "https://127.0.0.1:8443/api/health"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 15s
    init: true
    restart: unless-stopped

volumes:
  sekai-data:
    name: sekai-companion-data

# A dedicated range avoids exhausting Docker Desktop's automatic /16 address pools.
networks:
  default:
    ipam:
      config:
        - subnet: ${SEKAI_SUBNET:-10.211.39.0/24}
  # The recognizer has no outbound route and no host port. Only backend joins both networks.
  asr:
    internal: true
    ipam:
      config:
        - subnet: ${SEKAI_ASR_SUBNET:-10.211.40.0/24}
